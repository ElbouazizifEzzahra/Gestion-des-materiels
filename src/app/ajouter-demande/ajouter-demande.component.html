<div class="min-h-screen bg-gray-50 py-8">
  <div class="container mx-auto px-4 max-w-6xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Nouvelle demande</h1>

    <form class="bg-white shadow-md rounded-lg p-6">
      <!-- Informations générales -->
      <div class="mb-8 p-4 bg-gray-50 rounded-lg">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Informations générales</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">


          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2">Nom destinataire</label>
            <input type="text" placeholder="Nom de destinataire"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2">Prénom destinataire</label>
            <input type="text" placeholder="Prénom de destinataire"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2">Email destinataire</label>
            <input type="email" placeholder="Email de destinataire"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2">Type * </label>
            <select required >
              <option ></option>
              <option value="MO">Maitre d'ouvrage</option>
              <option value="EMPLOYE"> Employe</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2">Projet</label>
            <input type="text" placeholder="Projet"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- Liste des matériels -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-700">Matériels demandés</h2>
          <button type="button" (click)="addRow()"
                  class="flex items-center px-3 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Ajouter ligne
          </button>
        </div>

        <!-- En-têtes du tableau -->
        <div class="grid grid-cols-12 gap-2 mb-2 font-medium text-gray-700 text-sm">
          <div class="col-span-4">Matériel *</div>
          <div class="col-span-2">Type</div>
          <div class="col-span-1">Qté *</div>
          <div class="col-span-3">Description</div>
          <div class="col-span-1">Fiche technique</div>
          <div class="col-span-1"></div>
        </div>

        <!-- Lignes répétables -->
        <div class="space-y-3" >
          <div class="grid grid-cols-12 gap-2 items-center p-3 bg-gray-50 rounded-md">
            <!-- Matériel -->
            <div class="col-span-3">
              <select class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
                <option value=""></option>
                @for(materiel of materiels; track materiel.idMateriel) {
                <option [value]="materiel.idMateriel">{{materiel.nomMateriel}}</option>
                }
              </select>
            </div>

            <div class="col-span-3">
              <select class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
                <option value=""  ></option>
                @for(materiel of materiels; track materiel.idMateriel) {

                <option [value]="materiel.idMateriel">{{materiel.typeMateriel}}</option>
                }
              </select>
            </div>

            <!-- Quantité -->
            <div class="col-span-1">
              <input type="number" min="1" value="1"
                     class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
            </div>

            <!-- Description -->
            <div class="col-span-3">
              <input type="text" placeholder="Détails"
                     class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
            </div>

            <!-- Fichier -->
            <div class="col-span-1">
              <label class="flex justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <input type="file" class="hidden">
              </label>
            </div>

            <!-- Bouton Supprimer -->
            <div class="col-span-1 flex justify-center">
           <!--   <button type="button" (click)="removeRow(i)"
                      class="text-red-500 hover:text-red-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>-->
            </div>
          </div>
        </div>
      </div>

      <!-- Boutons de soumission -->
      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <button type="button" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 text-sm">
          Annuler
        </button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
          Enregistrer la demande
        </button>
      </div>
    </form>
  </div>
</div>
