<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside [class]="isSidebarOpen ? 'w-64' : 'w-20'" class="bg-red-700 text-white transition-all duration-300 ease-in-out flex flex-col">
    <!-- Header -->
    <div class="p-4 flex items-center justify-between border-b border-red-600">
      @if (isSidebarOpen) {
      <h2 class="text-xl font-bold truncate">Societe Rouandi</h2>
      }
      <button (click)="toggleSidebar()" class="p-1 rounded-full hover:bg-red-600 transition-colors">
        @if (isSidebarOpen) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
        }
      </button>
    </div>


    <nav class="flex-1 overflow-y-auto py-2">
      <ul class="space-y-1 px-2">
        <li>
          <a [routerLink]="['ajout']" routerLinkActive="bg-red-800"
             class="flex items-center p-3 rounded-lg hover:bg-red-600 transition-colors group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            @if (isSidebarOpen) {
            <span class="ml-3 truncate">Nouveau</span>
            } @else {
            <span class="sr-only">Nouveau</span>
            }
          </a>
        </li>

        <li>
          <a [routerLink]="['mes-demandes']" routerLinkActive="bg-red-800"
             class="flex items-center p-3 rounded-lg hover:bg-red-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            @if (isSidebarOpen) {
            <span class="ml-3 truncate">Mes demandes</span>
            } @else {
            <span class="sr-only">Mes demandes</span>
            }
          </a>
        </li>
      </ul>
    </nav>

    <div class="border-t border-red-600 pt-2 pb-4 px-2">
      <!-- Paramètres -->

      <button [routerLink]="['profil']" routerLinkActive="bg-red-800"
              class="flex items-center w-full p-3 rounded-lg hover:bg-red-600 transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        @if (isSidebarOpen) {
        <span class="ml-3 truncate">Paramètres</span>
        } @else {
        <span class="sr-only">Paramètres</span>
        }
      </button>

      <!-- Déconnexion -->
      <button (click)="logout()"
              class="flex items-center w-full p-3 rounded-lg hover:bg-red-600 transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        @if (isSidebarOpen) {
        <span class="ml-3 truncate">Déconnexion</span>
        } @else {
        <span class="sr-only">Déconnexion</span>
        }
      </button>
    </div>
  </aside>

  <!-- Contenu principal -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <app-navbar></app-navbar>
    <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
